<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteAhead</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <div class="logo-header">
        <span class="logo-white">Route</span><span class="logo-gold">Ahead</span>
    </div>

    <div class="container">
        <div id="authPage" class="card">
            <h2 id="authTitle">Sign In</h2>
            <input type="text" id="nameInput" class="input hidden" placeholder="Full Name" autocomplete="off">
            <input type="email" id="emailInput" class="input" placeholder="Email Address" autocomplete="off">
            <input type="password" id="passwordInput" class="input" placeholder="Password" autocomplete="new-password">
            <button id="authBtn" class="btn btn-auth" onclick="handleAuth()">Login</button>
            <a href="javascript:void(0)" id="toggleText" class="toggle-link" onclick="toggleAuth()">Don't have an account? Sign Up</a>
        </div>

        <div id="plannerPage" class="card hidden">
            <h2>Plan Your Journey</h2>
            <div id="originWrapper"></div>
            <div id="destinationWrapper"></div>
            <button class="btn btn-calc" onclick="planJourney()">Calculate Journey Weather</button>
            <div id="journeyResult" class="hidden"></div>
        </div>

        <div id="navigationPage" class="hidden">
            <div id="map"></div>
            <div style="text-align: center;">
                <button class="btn btn-reset" onclick="location.reload()">Reset and Return</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div>&copy; 2026 RouteAhead Navigation. All rights reserved.</div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="app.js"></script>
</body>
</html>
